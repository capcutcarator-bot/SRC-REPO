name: SHUVOxMODS Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Get Dobby prebuilt
        run: |
          mkdir -p jni/prebuilt/arm64-v8a
          curl -L -o jni/prebuilt/arm64-v8a/libdobby.a \
            "https://github.com/jmpews/Dobby/releases/download/alpha-1.0/libdobby_android_arm64.a" \
            || true
          if [ ! -s jni/prebuilt/arm64-v8a/libdobby.a ]; then
            echo "Building Dobby..."
            git clone --depth=1 https://github.com/jmpews/Dobby.git /tmp/Dobby
            cd /tmp/Dobby && mkdir build && cd build
            cmake .. \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-21 \
              -DANDROID_STL=c++_static \
              -DdobbySharedLibrary=OFF \
              -DdobbyStaticLibrary=ON \
              -DDOBBY_DEBUG=OFF \
              -DBUILD_WITH_TRAMPOLINE_ASM=OFF \
              -G Ninja
            ninja -j$(nproc) || true
            cp libdobby.a $GITHUB_WORKSPACE/jni/prebuilt/arm64-v8a/libdobby.a || true
          fi
          ls -lh jni/prebuilt/arm64-v8a/libdobby.a

      - name: Build libSHUVOxMODS.so
        run: |
          cd $GITHUB_WORKSPACE
          $ANDROID_NDK_ROOT/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            -j$(nproc)
          ls -lh libs/arm64-v8a/

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: libSHUVOxMODS-arm64
          path: libs/arm64-v8a/libSHUVOxMODS.so
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "SHUVOxMODS Build #${{ github.run_number }}"
          files: libs/arm64-v8a/libSHUVOxMODS.so
          body: "✅ Granny 3 arm64 — libSHUVOxMODS.so"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
