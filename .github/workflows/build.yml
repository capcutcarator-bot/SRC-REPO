name: SHUVOxMODS Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install deps
        run: sudo apt-get install -y ninja-build cmake

      - name: Build Dobby
        run: |
          git clone --depth=1 https://github.com/jmpews/Dobby.git /tmp/Dobby

          # patch Apple GOT syntax → Linux LLVM syntax
          ASM=$(find /tmp/Dobby -name "ClosureTrampolineBridge_arm64.asm" 2>/dev/null | head -1)
          sed -i 's/@PAGE//g' "$ASM"
          sed -i 's/\(, [a-zA-Z_]*\)@PAGEOFF/\1/g' "$ASM"
          sed -i 's/\b\([a-zA-Z_][a-zA-Z0-9_]*\)@PAGEOFF/:lo12:\1/g' "$ASM"

          mkdir -p /tmp/Dobby/build && cd /tmp/Dobby/build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            -DdobbySharedLibrary=OFF \
            -DdobbyStaticLibrary=ON \
            -DDOBBY_DEBUG=OFF \
            -G Ninja
          ninja -j$(nproc)

          mkdir -p $GITHUB_WORKSPACE/jni/prebuilt/arm64-v8a
          cp libdobby.a $GITHUB_WORKSPACE/jni/prebuilt/arm64-v8a/libdobby.a
          echo "[✓] $(du -h $GITHUB_WORKSPACE/jni/prebuilt/arm64-v8a/libdobby.a)"

      - name: Build libSHUVOxMODS.so
        run: |
          cd $GITHUB_WORKSPACE
          $ANDROID_NDK_ROOT/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            -j$(nproc)
          ls -lh libs/arm64-v8a/

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: libSHUVOxMODS-arm64
          path: libs/arm64-v8a/libSHUVOxMODS.so
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "SHUVOxMODS Build #${{ github.run_number }}"
          files: libs/arm64-v8a/libSHUVOxMODS.so
          body: "✅ Granny 3 arm64 — libSHUVOxMODS.so"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
